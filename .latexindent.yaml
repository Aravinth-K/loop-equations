# Run from the manuscript root: latexindent -m -l=.latexindent.yaml -w file.tex
defaultIndent: '    '
indentPreamble: 1
removeTrailingWhitespace:
  beforeProcessing: 1
  afterProcessing: 1
lookForAlignDelims:
  gathered: 1
  multline: 1
  eqnarray: 1
fineTuning:
  lookForAlignDelimsDefaults:
    alignDoubleBackSlash: 0
    doubleBackSlash: '\\\\\*?(?:\h*\[[^\]\n]*\])?'
specialBeginEnd:
  - amalgamate: 1
  - name: equationShortcuts
    begin: '\\beq\b'
    end: '\\eeq\b'
modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 100
    comments:
      wrap: 0
    blocksFollow:
      other: '\\\]|\\item(?:\h|\[)|\\end\{[^}]+\}|\\eeq\b'
  environments:
    BodyStartsOnOwnLine: 1
    EndStartsOnOwnLine: 1
    DBSFinishesWithLineBreak: 1
